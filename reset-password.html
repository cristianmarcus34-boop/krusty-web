<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krusty Burger - Restablecer Contraseña</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1A1A1A;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #F5C518;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #B0B0B0;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .button {
            display: inline-block;
            background: #F5C518;
            color: #0A0A0A;
            padding: 14px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin: 10px 0;
            transition: background 0.3s;
        }

        .button:hover {
            background: #D4A800;
        }

        .button-secondary {
            background: transparent;
            border: 2px solid #F5C518;
            color: #F5C518;
        }

        .button-secondary:hover {
            background: #F5C51820;
        }

        .mensaje {
            color: #B0B0B0;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .telefono {
            display: block;
            margin-top: 30px;
            padding: 20px;
            background: #2A2A2A;
            border-radius: 12px;
        }

        .telefono p {
            color: #B0B0B0;
            font-size: 14px;
        }

        .telefono strong {
            color: #F5C518;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #F5C518;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🍔</div>
        <h1>Krusty Burger</h1>
        <p class="subtitle">Restablecer contraseña</p>

        <!-- ✅ BOTÓN PARA ABRIR LA APP -->
        <a href="#" id="abrirApp" class="button">
            📱 Abrir en la App
        </a>

        <!-- ✅ MENSAJE PARA QUIENES NO TIENEN LA APP -->
        <div class="mensaje">
            <p>Si no tienes la app instalada, descárgala desde:</p>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
            <a href="https://play.google.com/store/apps/details?id=com.agenciapowa.KrustyBurger"
                class="button button-secondary">
                Google Play
            </a>
            <a href="#" class="button button-secondary" style="opacity: 0.5;">
                App Store
            </a>
        </div>

        <!-- ✅ DETECCIÓN AUTOMÁTICA -->
        <div class="telefono" id="detectado">
            <p>🔄 Detectando dispositivo...</p>
        </div>

        <p style="margin-top: 20px; font-size: 12px; color: #666;">
            Al hacer clic en "Abrir en la App", la aplicación se iniciará automáticamente.
        </p>
    </div>

    <script>
        // ============================================================
        // 🔍 DETECTAR DISPOSITIVO Y ABRIR APP CON TOKEN
        // ============================================================
        (function () {
            const detectado = document.getElementById('detectado');

            // ✅ EXTRAER EL TOKEN DEL HASH (#access_token=xxx)
            function obtenerToken() {
                const hash = window.location.hash;
                console.log('📍 Hash completo:', hash);

                if (hash && hash.includes('access_token=')) {
                    // Buscar access_token en el hash
                    const match = hash.match(/access_token=([^&]+)/);
                    if (match) {
                        const token = decodeURIComponent(match[1]);
                        console.log('🔑 Token extraído:', token.substring(0, 30) + '...');
                        return token;
                    }
                }

                // También buscar en query string por si acaso
                const search = window.location.search;
                if (search) {
                    const params = new URLSearchParams(search);
                    const token = params.get('access_token');
                    if (token) {
                        console.log('🔑 Token extraído de query string:', token.substring(0, 30) + '...');
                        return token;
                    }
                }

                console.log('❌ No se encontró token en la URL');
                return null;
            }

            const token = obtenerToken();

            // Detectar si es Android o iOS
            const esAndroid = /android/i.test(navigator.userAgent);
            const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
            const esTelefono = esAndroid || esIOS;

            // Construir la URL para la app
            let appUrl = 'krustyburger://reset-password';
            if (token) {
                appUrl += '?token=' + encodeURIComponent(token);
            }

            console.log('🔗 URL de la app:', appUrl);

            // Actualizar el botón
            const boton = document.getElementById('abrirApp');
            boton.href = appUrl;

            // Mostrar información de depuración
            console.log('📱 Dispositivo:', {
                esAndroid,
                esIOS,
                esTelefono,
                token: token ? token.substring(0, 20) + '...' : 'No'
            });

            // Si es teléfono, intentar abrir automáticamente
            if (esTelefono) {
                detectado.innerHTML = `
                    <p>📱 Detectado: <strong>${esAndroid ? 'Android' : 'iOS'}</strong></p>
                    <p style="font-size: 13px; color: #666; margin-top: 5px;">
                        ${token ? '✅ Token encontrado. Abriendo la app...' : '⚠️ No se encontró token. Abriendo la app...'}
                    </p>
                    <div class="loading"></div>
                `;

                // ✅ INTENTAR ABRIR LA APP AUTOMÁTICAMENTE
                setTimeout(() => {
                    window.location.href = appUrl;
                }, 1000);

                // ⚠️ Si la app no está instalada, redirigir a Play Store después de 4 segundos
                setTimeout(() => {
                    if (esAndroid) {
                        window.location.href = 'https://play.google.com/store/apps/details?id=com.agenciapowa.KrustyBurger';
                    } else if (esIOS) {
                        window.location.href = 'https://apps.apple.com/app/krustyburger';
                    }
                }, 5000);

            } else {
                // 💻 Es una computadora
                detectado.innerHTML = `
                    <p>🖥️ Detectado: <strong>Computadora</strong></p>
                    <p style="font-size: 13px; color: #666; margin-top: 5px;">
                        La app nativa solo funciona en dispositivos móviles.
                    </p>
                    <p style="font-size: 13px; color: #666; margin-top: 5px;">
                        Escanea el código QR desde tu teléfono para continuar.
                    </p>
                    ${token ? `<p style="font-size: 12px; color: #888; margin-top: 10px;">🔑 Token encontrado ✅</p>` : ''}
                `;
            }
        })();
    </script>
</body>

</html>
