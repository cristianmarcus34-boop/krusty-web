<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krusty Burger - Restablecer Contraseña</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1A1A1A;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #F5C518;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #B0B0B0;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .button {
            display: inline-block;
            background: #F5C518;
            color: #0A0A0A;
            padding: 14px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin: 10px 0;
            transition: background 0.3s;
        }

        .button:hover {
            background: #D4A800;
        }

        .button-secondary {
            background: transparent;
            border: 2px solid #F5C518;
            color: #F5C518;
        }

        .button-secondary:hover {
            background: #F5C51820;
        }

        .mensaje {
            color: #B0B0B0;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .telefono {
            display: block;
            margin-top: 30px;
            padding: 20px;
            background: #2A2A2A;
            border-radius: 12px;
        }

        .telefono p {
            color: #B0B0B0;
            font-size: 14px;
        }

        .telefono strong {
            color: #F5C518;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🍔</div>
        <h1>Krusty Burger</h1>
        <p class="subtitle">Restablecer contraseña</p>

        <!-- ✅ BOTÓN PARA ABRIR LA APP -->
        <a href="krustyburger://reset-password" class="button">
            📱 Abrir en la App
        </a>

        <!-- ✅ MENSAJE PARA QUIENES NO TIENEN LA APP -->
        <div class="mensaje">
            <p>Si no tienes la app instalada, descárgala desde:</p>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
            <a href="https://play.google.com/store/apps/details?id=com.agenciapowa.KrustyBurger"
                class="button button-secondary">
                Google Play
            </a>
            <a href="#" class="button button-secondary" style="opacity: 0.5;">
                App Store
            </a>
        </div>

        <!-- ✅ DETECCIÓN AUTOMÁTICA (JavaScript) -->
        <div class="telefono" id="detectado">
            <p>🔄 Detectando dispositivo...</p>
        </div>

        <p style="margin-top: 20px; font-size: 12px; color: #666;">
            Al hacer clic en "Abrir en la App", la aplicación se iniciará automáticamente.
        </p>
    </div>

    <script>
        // ============================================================
        // 🔍 DETECTAR DISPOSITIVO Y ABRIR APP AUTOMÁTICAMENTE
        // ============================================================
        (function () {
            const detectado = document.getElementById('detectado');

            // 1. Detectar si es Android o iOS
            const esAndroid = /android/i.test(navigator.userAgent);
            const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
            const esTelefono = esAndroid || esIOS;

            // 2. Si es teléfono, intentar abrir la app automáticamente
            if (esTelefono) {
                detectado.innerHTML = `
                    <p>📱 Detectado: <strong>${esAndroid ? 'Android' : 'iOS'}</strong></p>
                    <p style="font-size: 13px; color: #666; margin-top: 5px;">
                        Intentando abrir la app automáticamente...
                    </p>
                `;

                // ✅ REDIRIGIR A LA APP
                setTimeout(() => {
                    window.location.href = 'krustyburger://reset-password';
                }, 1000);

                // ⚠️ Si la app no está instalada, redirigir a la Play Store después de 3 segundos
                setTimeout(() => {
                    if (esAndroid) {
                        window.location.href = 'https://play.google.com/store/apps/details?id=com.agenciapowa.KrustyBurger';
                    } else if (esIOS) {
                        window.location.href = 'https://apps.apple.com/app/krustyburger'; // Reemplaza con tu URL
                    }
                }, 3000);

            } else {
                // 💻 Es una computadora
                detectado.innerHTML = `
                    <p>🖥️ Detectado: <strong>Computadora</strong></p>
                    <p style="font-size: 13px; color: #666; margin-top: 5px;">
                        La app nativa solo funciona en dispositivos móviles.
                    </p>
                    <p style="font-size: 13px; color: #666; margin-top: 5px;">
                        Escanea el código QR desde tu teléfono para continuar.
                    </p>
                `;
            }

            // 3. Log para debugging
            console.log('📱 Dispositivo detectado:', {
                esAndroid,
                esIOS,
                esTelefono,
                userAgent: navigator.userAgent
            });
        })();
    </script>
</body>

</html>
